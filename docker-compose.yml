services:
  db:
    image: mysql:8.0
    container_name: jobtech_mysql
    environment:
      MYSQL_DATABASE: jobtech_db
      MYSQL_USER: jobtech_user
      MYSQL_PASSWORD: jobtech_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: jobtech_backend
    volumes:
      - ./app/backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "True"
      DATABASE_URL: mysql://jobtech_user:jobtech_password@db:3306/jobtech_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
