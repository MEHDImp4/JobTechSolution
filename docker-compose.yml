services:
  db:
    image: mysql:8.0
    container_name: jobtech_mysql
    environment:
      MYSQL_DATABASE: jobtech_db
      MYSQL_USER: jobtech_user
      MYSQL_PASSWORD: jobtech_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - target: 3306
        published: 0
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jobtech_redis
    volumes:
      - redis_data:/data
    ports:
      - target: 6379
        published: 0
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtech_backend
    ports:
      - target: 8000
        published: 0
        protocol: tcp
        mode: host
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://jobtech_user:jobtech_password@db:3306/jobtech_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "cd /app && python manage.py migrate &&
               python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtech_celery_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://jobtech_user:jobtech_password@db:3306/jobtech_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A jobtech worker -l INFO -Q celery,ia_queue,email_queue,pdf_queue
    restart: unless-stopped

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobtech_celery_beat
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://jobtech_user:jobtech_password@db:3306/jobtech_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A jobtech beat -l INFO
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobtech_frontend
    volumes:
      # Map node_modules to a volume to avoid local OS conflicts and ensure Docker's native node_modules are used
      - frontend_node_modules:/app/node_modules
    ports:
      - target: 5173
        published: 0
        protocol: tcp
        mode: host
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  frontend_node_modules:
    driver: local
