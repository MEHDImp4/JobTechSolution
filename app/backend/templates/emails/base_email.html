<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}JobTech Solutions{% endblock %}</title>
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }

    /* Base */
    body {
      margin: 0 !important;
      padding: 0 !important;
      background-color: #f4f6f9;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #343a40;
    }

    /* Wrapper */
    .email-wrapper {
      width: 100%;
      background-color: #f4f6f9;
      padding: 32px 0;
    }

    /* Container */
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* Header */
    .email-header {
      background-color: #0d6efd;
      padding: 28px 40px;
      text-align: center;
    }
    .email-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .email-header .tagline {
      margin: 4px 0 0;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }

    /* Body */
    .email-body {
      padding: 36px 40px;
    }
    .email-body h2 {
      margin-top: 0;
      font-size: 20px;
      color: #212529;
    }
    .email-body p {
      margin: 0 0 16px;
      color: #495057;
    }

    /* CTA Button */
    .btn-primary {
      display: inline-block;
      padding: 14px 32px;
      background-color: #0d6efd;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin: 8px 0 24px;
    }
    .btn-primary:hover { background-color: #0b5ed7; }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid #e9ecef;
      margin: 24px 0;
    }

    /* Footer */
    .email-footer {
      background-color: #f8f9fa;
      padding: 20px 40px;
      text-align: center;
      font-size: 12px;
      color: #868e96;
      border-top: 1px solid #e9ecef;
    }
    .email-footer a {
      color: #0d6efd;
      text-decoration: none;
    }

    /* Utility */
    .text-muted { color: #6c757d; font-size: 13px; }
    .text-center { text-align: center; }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-container">

      <!-- Header -->
      <div class="email-header">
        <h1>JobTech Solutions</h1>
        <p class="tagline">Plateforme de gestion des entretiens RH</p>
      </div>

      <!-- Body -->
      <div class="email-body">
        {% block body %}{% endblock %}
      </div>

      <!-- Footer -->
      <div class="email-footer">
        <p>
          Vous recevez cet e-mail car une inscription a été effectuée sur
          <a href="#">JobTech Solutions</a>.
        </p>
        <p>
          Si vous n'avez pas effectué cette action, vous pouvez ignorer cet e-mail.
        </p>
        <p style="margin-top: 12px; color: #adb5bd;">
          &copy; {% now "Y" %} JobTech Solutions &mdash; EMSI
        </p>
      </div>

    </div>
  </div>
</body>
</html>
