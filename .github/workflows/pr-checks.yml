name: PR Checks

on:
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Run backend tests
        working-directory: app/backend
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          VAPID_PUBLIC_KEY: BCx_DummyPublicKey_ReplaceInProd
          VAPID_PRIVATE_KEY: DummyPrivateKey_ReplaceInProd
          VAPID_ADMIN_EMAIL: admin@example.com
        run: python manage.py test

  frontend-quality:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix app/frontend ci

      - name: Lint frontend
        run: npm --prefix app/frontend run lint

      - name: Typecheck frontend
        run: npm --prefix app/frontend run typecheck

      - name: Build frontend
        run: npm --prefix app/frontend run build
