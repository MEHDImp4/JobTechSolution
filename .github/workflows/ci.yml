name: "🚀 JobTech Solution CI"

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, develop ]

# Annuler les builds en cours si un nouveau commit est poussé
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- ÉTAPE 1 : QUALITÉ & SÉCURITÉ ---
  quality:
    name: "🧹 Quality & Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "📦 Install Backend Linting Tools"
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy django-stubs types-requests bandit safety
          pip install -r app/backend/requirements.txt

      - name: "🔍 Lint with Ruff"
        run: ruff check .

      - name: "✨ Check Format with Ruff"
        run: ruff format --check .

      - name: "🎯 Type Check with Mypy"
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/app/backend
          mypy .
        continue-on-error: true

      - name: "🛡️ Security Scan (Bandit)"
        run: bandit -r app/backend/ -x app/backend/venv,app/backend/tests,app/backend/apps/*/tests -ll

      - name: "🩹 Dependency Audit (Safety)"
        run: safety check -r app/backend/requirements.txt
        continue-on-error: true # Safety peut être capricieux sans API key

  # --- ÉTAPE 2 : TESTS BACKEND ---
  backend-tests:
    name: "🧪 Backend Tests"
    needs: quality
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: "🚦 Run Django Tests"
        env:
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "ci-secret-key"
          DEBUG: "False"
          VAPID_PUBLIC_KEY: "BCx_DummyPublicKey_ReplaceInProd"
          VAPID_PRIVATE_KEY: "DummyPrivateKey_ReplaceInProd"
          VAPID_ADMIN_EMAIL: "admin@example.com"
        working-directory: app/backend
        run: python manage.py test

  # --- ÉTAPE 3 : FRONTEND (Build & Lint) ---
  frontend:
    name: "⚛️ Frontend Quality"
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: "📦 Install Frontend Dependencies"
        working-directory: app/frontend
        run: npm ci --legacy-peer-deps

      - name: "🔍 Lint with ESLint"
        working-directory: app/frontend
        run: npm run lint

      - name: "🏗️ Build Frontend"
        working-directory: app/frontend
        run: npm run build

  # --- ÉTAPE 4 : APPROBATION FINALE ---
  summary:
    name: "✅ Final Results"
    needs: [backend-tests, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "📊 Check Status"
        run: |
          if [[ "${{ needs.backend-tests.result }}" == "success" && "${{ needs.frontend.result }}" == "success" ]]; then
            echo "All systems go! 🚀"
          else
            echo "Some checks failed. Please review the logs."
            exit 1
          fi
