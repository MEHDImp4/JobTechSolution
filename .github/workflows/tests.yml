name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix app/frontend ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: API tests
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          VAPID_PUBLIC_KEY: BCx_DummyPublicKey_ReplaceInProd
          VAPID_PRIVATE_KEY: DummyPrivateKey_ReplaceInProd
          VAPID_ADMIN_EMAIL: admin@example.com
        run: npm run test:api

  e2e:
    runs-on: ubuntu-latest
    needs: quality-and-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix app/frontend ci

      - name: Install Playwright browsers
        run: npm --prefix app/frontend exec playwright install --with-deps chromium

      - name: Run E2E
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: sqlite:///app/backend/db.sqlite3
          REDIS_URL: redis://localhost:6379/0
          VAPID_PUBLIC_KEY: BCx_DummyPublicKey_ReplaceInProd
          VAPID_PRIVATE_KEY: DummyPrivateKey_ReplaceInProd
          VAPID_ADMIN_EMAIL: admin@example.com
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/frontend/playwright-report
          retention-days: 14
