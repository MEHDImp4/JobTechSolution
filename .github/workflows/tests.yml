name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix app/frontend ci

      - name: Lint
        run: npm --prefix app/frontend run lint

      - name: Typecheck
        run: npm --prefix app/frontend run typecheck

      - name: Build
        run: npm --prefix app/frontend run build

      - name: API tests
        env:
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          DATABASE_URL: sqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          VAPID_PUBLIC_KEY: BCx_DummyPublicKey_ReplaceInProd
          VAPID_PRIVATE_KEY: DummyPrivateKey_ReplaceInProd
          VAPID_ADMIN_EMAIL: admin@example.com
        run: npm --prefix app/frontend run test:api

