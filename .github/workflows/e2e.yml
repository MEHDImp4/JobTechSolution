name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Create CI environment file
      run: |
        cp .env.example .env
        {
          echo "SECRET_KEY=ci-secret-key"
          echo "ALLOWED_HOSTS=localhost,127.0.0.1,backend"
        } >> .env

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: app/frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: npm --prefix app/frontend ci --legacy-peer-deps

    - name: Install Playwright Browsers
      run: npx --prefix app/frontend playwright install --with-deps

    - name: Start Full Stack Application via Docker Compose
      run: docker compose up -d --build

    - name: Wait for services to be ready
      run: |
        for i in {1..24}; do
          mysql_status=$(docker inspect --format '{{.State.Health.Status}}' jobtech_mysql)
          redis_status=$(docker inspect --format '{{.State.Health.Status}}' jobtech_redis)
          backend_status=$(docker inspect --format '{{.State.Health.Status}}' jobtech_backend)
          frontend_status=$(docker inspect --format '{{.State.Health.Status}}' jobtech_frontend)
          if [ "$mysql_status" = "healthy" ] && [ "$redis_status" = "healthy" ] && [ "$backend_status" = "healthy" ] && [ "$frontend_status" = "healthy" ]; then
            exit 0
          fi
          sleep 5
        done
        docker compose ps
        exit 1

    - name: Seed Database
      run: docker compose exec -T backend python manage.py seed_data || true

    - name: Run Playwright tests
      run: npm --prefix app/frontend run test:e2e
      env:
        E2E_BASE_URL: http://127.0.0.1:5173
        E2E_BACKEND_URL: http://127.0.0.1:8000
        PLAYWRIGHT_USE_EXTERNAL_SERVER: "true"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: app/frontend/playwright-report/
        retention-days: 30

    - name: Show Docker logs on failure
      if: failure()
      run: docker compose logs --no-color

    - name: Tear down Docker Compose
      if: always()
      run: docker compose down -v
