name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Start Full Stack Application via Docker Compose
      run: docker compose up -d --build
        
    - name: Wait for services to be ready
      run: sleep 45 # Let time for Django migrations, DB init and Vite to start
      
    - name: Seed Database
      run: docker compose exec -T backend python manage.py seed_data || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Frontend Dependencies
      run: |
        cd app/frontend
        npm ci
        
    - name: Install Playwright Browsers
      run: |
        cd app/frontend
        npx playwright install --with-deps
        
    - name: Run Playwright tests
      run: |
        cd app/frontend
        npm run test:e2e
      env:
        E2E_BASE_URL: http://localhost:5173
        
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: app/frontend/playwright-report/
        retention-days: 30
